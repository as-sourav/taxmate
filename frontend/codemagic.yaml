environment:
  vars:
    XCODE_PROJECT: "ios/App/App.xcodeproj"
    XCODE_SCHEME: "App"
  xcode: latest

scripts:
  - name: Check project directory
    script: |
      echo "Build directory: $CM_BUILD_DIR"
      pwd
      ls -la
      echo "Checking package.json scripts..."
      npm run

  - name: Install npm dependencies
    script: |
      npm ci

  - name: Build web application
    script: |
      npm run build

  - name: Verify web build output
    script: |
      test -d dist || {
        echo "ERROR: Vite build did not create the dist directory."
        exit 1
      }
      echo "Web build completed successfully."

  - name: Sync Capacitor iOS
    script: |
      npx cap sync ios

  - name: Install CocoaPods dependencies
    script: |
      cd "$CM_BUILD_DIR/ios/App"
      pod install

  - name: Build iOS application
    script: |
      xcode-project build-ipa \
        --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
        --scheme "$XCODE_SCHEME"

artifacts:
  - build/ios/ipa/*.ipa
  - /tmp/xcodebuild_logs/*.log
  - ios/App/build/**/*.dSYM
