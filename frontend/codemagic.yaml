environment:
  xcode: latest
  vars:
    PROJECT_DIR: "."
    XCODE_PROJECT: "ios/App/App.xcodeproj"
    XCODE_SCHEME: "App"

scripts:
  - name: Verify project structure
    script: |
      cd "$CM_BUILD_DIR"

      echo "Project directory: $(pwd)"
      echo "Root files:"
      ls -la

      if [ ! -f package.json ]; then
        echo "ERROR: package.json not found in repository root."
        exit 1
      fi

      if [ ! -f package-lock.json ]; then
        echo "ERROR: package-lock.json not found. Commit your npm lockfile."
        exit 1
      fi

      echo "Package scripts:"
      node -e 'console.log(JSON.stringify(require("./package.json").scripts, null, 2))'

      node -e '
        const scripts = require("./package.json").scripts || {};
        if (!scripts.build) {
          console.error("ERROR: Missing build script in root package.json");
          process.exit(1);
        }
      '

  - name: Install npm dependencies
    script: |
      cd "$CM_BUILD_DIR"
      npm ci

  - name: Build web application
    script: |
      cd "$CM_BUILD_DIR"
      npm run build

  - name: Verify web build output
    script: |
      cd "$CM_BUILD_DIR"

      if [ ! -d dist ]; then
        echo "ERROR: Vite did not create the dist directory."
        exit 1
      fi

      echo "Vite build output:"
      ls -la dist

  - name: Verify iOS project
    script: |
      cd "$CM_BUILD_DIR"

      if [ ! -d ios/App ]; then
        echo "ERROR: ios/App directory not found."
        echo "Check whether the iOS platform is committed to Git."
        exit 1
      fi

      if [ ! -d "$XCODE_PROJECT" ]; then
        echo "ERROR: Xcode project not found at $XCODE_PROJECT"
        exit 1
      fi

  - name: Sync Capacitor iOS
    script: |
      cd "$CM_BUILD_DIR"
      npx cap sync ios

  - name: Install CocoaPods dependencies
    script: |
      cd "$CM_BUILD_DIR/ios/App"
      pod install

  - name: Build iOS IPA
    script: |
      cd "$CM_BUILD_DIR"

      xcode-project build-ipa \
        --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
        --scheme "$XCODE_SCHEME"

artifacts:
  - build/ios/ipa/*.ipa
  - /tmp/xcodebuild_logs/*.log
  - ios/App/build/**/*.dSYM
