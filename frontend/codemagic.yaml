workflows: capacitor-ios: name: TaxMate Build Diagnostic max_build_duration: 120 instance_type: mac_mini_m2

scripts:
  - name: Find package.json and build script
    script: |
      set -eu

      echo "========== CODEMAGIC DIRECTORY =========="
      echo "CM_BUILD_DIR=$CM_BUILD_DIR"
      cd "$CM_BUILD_DIR"
      pwd

      echo "========== FIND PACKAGE FILES =========="
      find "$CM_BUILD_DIR" \
        -name package.json \
        -not -path '*/node_modules/*' \
        -not -path '*/ios/Pods/*' \
        -not -path '*/.git/*' \
        -print

      echo "========== ROOT PACKAGE.JSON =========="
      if [ -f "$CM_BUILD_DIR/package.json" ]; then
        cat "$CM_BUILD_DIR/package.json"
      else
        echo "No package.json in repository root"
      fi

      echo "========== ROOT NPM SCRIPTS =========="
      if [ -f "$CM_BUILD_DIR/package.json" ]; then
        npm run
      fi

      echo "========== CHECK GIT COMMIT =========="
      git rev-parse --short HEAD || true
      git status --short || true