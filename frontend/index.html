
<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>TaxMate</title>

    <!--
      Injected by taxmate/www/taxmate.py get_context().
      frappe-js-sdk reads window.csrf_token and attaches X-Frappe-CSRF-Token.
      The site name comes from the server — never hardcode it.
    -->
    <script>
      window.csrf_token = "{{ csrf_token }}";
      window.site_name = "{{ site_name }}";
      window.taxmate_boot = {
        user: "{{ frappe_user }}",
        socket_port: "{{ socket_port }}"
      };
    </script>

    <!-- TaxMate iOS installation styles -->
    <style>
      #taxmate-ios-install {
        box-sizing: border-box;
        max-width: 480px;
        margin: 32px auto;
        padding: 24px;
        text-align: center;
        font-family: Arial, sans-serif;
        color: #1f2937;
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
      }

      #taxmate-ios-install h2 {
        margin: 0 0 12px;
        font-size: 24px;
      }

      #taxmate-ios-install p {
        margin: 0 0 20px;
        line-height: 1.6;
        color: #475569;
      }

      #taxmate-ios-install .install-button {
        display: inline-block;
        padding: 14px 24px;
        border-radius: 10px;
        background: #2563eb;
        color: #fff;
        text-decoration: none;
        font-weight: 600;
      }

      #taxmate-ios-install .install-button:hover {
        background: #1d4ed8;
      }

      #taxmate-ios-install .install-note {
        margin-top: 16px;
        margin-bottom: 0;
        font-size: 13px;
      }

      @media (max-width: 520px) {
        #taxmate-ios-install {
          margin: 20px 16px;
          padding: 20px;
        }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>

    <!--
      iOS OTA installation section.
      Replace YOUR-DOMAIN.com with the real HTTPS hosting domain.
      Remove hidden once the IPA and manifest are deployed.
    -->
    <section id="taxmate-ios-install" hidden>
      <h2>Install TaxMate on iPhone</h2>

      <p>
        Open this page in Safari on your registered iPhone
        to install TaxMate.
      </p>

      <a
        class="install-button"
        href="itms-services://?action=download-manifest&amp;url=https%3A%2F%2FYOUR-DOMAIN.com%2Fmanifest.plist"
      >
        Install TaxMate for iOS
      </a>

      <p class="install-note">
        Installation requires a compatible iPhone and a valid
        provisioning profile.
      </p>
    </section>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
