
workflows:
  capacitor-ios:
    name: Capacitor iOS Build
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        NODE_VERSION: "22"

    scripts:
      - name: Locate frontend project
        script: |
          set -e

          echo "Repository directory: $CM_BUILD_DIR"
          echo "Searching for package.json..."

          PACKAGE_FILE=$(find "$CM_BUILD_DIR" \
            -maxdepth 5 \
            -type f \
            -name package.json \
            -not -path '*/node_modules/*' \
            -not -path '*/ios/App/Pods/*' \
            | head -n 1)

          if [ -z "$PACKAGE_FILE" ]; then
            echo "ERROR: Cannot find package.json in the repository."
            echo "Check that your frontend source code is committed."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE_FILE")
          echo "Frontend project found: $PROJECT_DIR"

          echo "$PROJECT_DIR" > /tmp/frontend_project_dir.txt

      - name: Check Node.js and npm
        script: |
          set -e
          node --version
          npm --version

      - name: Install npm dependencies
        script: |
          set -e

          PROJECT_DIR=$(cat /tmp/frontend_project_dir.txt)
          cd "$PROJECT_DIR"

          echo "Installing dependencies in: $(pwd)"

          if [ ! -f package-lock.json ]; then
            echo "ERROR: package-lock.json not found in $PROJECT_DIR"
            echo "Commit the matching package-lock.json to your repository."
            exit 1
          fi

          npm ci --no-audit --no-fund

      - name: Build web application
        script: |
          set -e

          PROJECT_DIR=$(cat /tmp/frontend_project_dir.txt)
          cd "$PROJECT_DIR"

          npm run build:mobile

      - name: Sync Capacitor iOS
        script: |
          set -e

          PROJECT_DIR=$(cat /tmp/frontend_project_dir.txt)
          cd "$PROJECT_DIR"

          npx cap sync ios

      - name: Install CocoaPods dependencies
        script: |
          set -e

          PROJECT_DIR=$(cat /tmp/frontend_project_dir.txt)
          cd "$PROJECT_DIR/ios/App"

          pod install

      - name: Build iOS application
        script: |
          set -e

          PROJECT_DIR=$(cat /tmp/frontend_project_dir.txt)

          xcode-project build-ipa \
            --project "$PROJECT_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - "**/build/ios/ipa/*.ipa"
      - "**/ios/App/build/**/*.ipa"
      - /tmp/xcodebuild_logs/*.log
