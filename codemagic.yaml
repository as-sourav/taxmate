workflows:
  capacitor-ios:
    name: TaxMate iOS Development Build
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: taxmate-app-store-connect

    environment:
      ios_signing:
        distribution_type: development
        bundle_identifier: com.ascratech.taxmate

      vars:
        XCODE_SCHEME: "App"

      node: latest
      xcode: latest

    scripts:
      - name: Locate frontend project
        script: |
          set -euo pipefail

          PACKAGE_FILE=""

          while IFS= read -r file; do
            if [ -f "$(dirname "$file")/capacitor.config.ts" ] ||
               [ -f "$(dirname "$file")/capacitor.config.json" ] ||
               [ -f "$(dirname "$file")/capacitor.config.js" ]; then
              PACKAGE_FILE="$file"
              break
            fi
          done < <(
            find "$CM_BUILD_DIR" \
              -maxdepth 6 \
              -type f \
              -name package.json \
              -not -path '*/node_modules/*' \
              -not -path '*/.git/*'
          )

          if [ -z "$PACKAGE_FILE" ]; then
            echo "ERROR: Could not find package.json with Capacitor config."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PACKAGE_FILE")"
          echo "$PROJECT_DIR" > /tmp/taxmate_project_dir.txt

          echo "Frontend project: $PROJECT_DIR"

      - name: Check build environment
        script: |
          set -euo pipefail

          node --version
          npm --version
          xcodebuild -version
          xcodebuild -showsdks

      - name: Install npm dependencies
        script: |
          set -euo pipefail

          PROJECT_DIR="$(cat /tmp/taxmate_project_dir.txt)"
          cd "$PROJECT_DIR"

          if [ ! -f package-lock.json ]; then
            echo "ERROR: package-lock.json is required for npm ci."
            exit 1
          fi

          npm ci --no-audit --no-fund

      - name: Build web application
        script: |
          set -euo pipefail

          PROJECT_DIR="$(cat /tmp/taxmate_project_dir.txt)"
          cd "$PROJECT_DIR"

          npm run build:mobile

          if [ ! -d dist-mobile ]; then
            echo "ERROR: dist-mobile was not generated."
            exit 1
          fi

          echo "Web application build completed."

      - name: Prepare Capacitor iOS project
        script: |
          set -euo pipefail

          PROJECT_DIR="$(cat /tmp/taxmate_project_dir.txt)"
          cd "$PROJECT_DIR"

          if [ ! -f capacitor.config.ts ] &&
             [ ! -f capacitor.config.json ] &&
             [ ! -f capacitor.config.js ]; then
            echo "ERROR: Capacitor config file not found."
            exit 1
          fi

          if [ ! -d ios ]; then
            echo "Creating the iOS platform."
            npx cap add ios
          fi

          npx cap sync ios

          IOS_PROJECT="$PROJECT_DIR/ios/App/App.xcodeproj"

          if [ ! -d "$IOS_PROJECT" ]; then
            echo "ERROR: $IOS_PROJECT not found."
            exit 1
          fi

          echo "Capacitor iOS project prepared."

      - name: Verify bundle identifier and scheme
        script: |
          set -euo pipefail

          PROJECT_DIR="$(cat /tmp/taxmate_project_dir.txt)"
          IOS_PROJECT="$PROJECT_DIR/ios/App/App.xcodeproj"

          echo "Available schemes:"
          xcodebuild -list -project "$IOS_PROJECT"

          if ! xcodebuild \
            -showBuildSettings \
            -project "$IOS_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            2>/dev/null |
            grep -Fq 'PRODUCT_BUNDLE_IDENTIFIER = com.ascratech.taxmate'; then
            echo "WARNING: Verify PRODUCT_BUNDLE_IDENTIFIER in Xcode."
            echo "Expected: com.ascratech.taxmate"
          fi

      - name: Configure iOS code signing
        script: |
          set -euo pipefail

          PROJECT_DIR="$(cat /tmp/taxmate_project_dir.txt)"
          cd "$PROJECT_DIR"

          # Requires a matching development certificate and profile
          # to be available in Codemagic Code signing identities.
          xcode-project use-profiles \
            --project "ios/App/App.xcodeproj"

      - name: Resolve Swift dependencies
        script: |
          set -euo pipefail

          PROJECT_DIR="$(cat /tmp/taxmate_project_dir.txt)"

          xcodebuild \
            -resolvePackageDependencies \
            -project "$PROJECT_DIR/ios/App/App.xcodeproj" \
            -scheme "$XCODE_SCHEME"

      - name: Build development IPA
        script: |
          set -euo pipefail

          PROJECT_DIR="$(cat /tmp/taxmate_project_dir.txt)"

          xcode-project build-ipa \
            --project "$PROJECT_DIR/ios/App/App.xcodeproj" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app