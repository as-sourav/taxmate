
workflows:
  capacitor-ios:
    name: Capacitor iOS Build
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      vars:
        XCODE_SCHEME: "App"

    scripts:
      - name: Locate frontend project
        script: |
          set -e

          PACKAGE_FILE=$(find "$CM_BUILD_DIR" \
            -maxdepth 5 \
            -type f \
            -name package.json \
            -not -path '*/node_modules/*' \
            -not -path '*/ios/App/Pods/*' \
            | head -n 1)

          if [ -z "$PACKAGE_FILE" ]; then
            echo "ERROR: package.json not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE_FILE")
          echo "$PROJECT_DIR" > /tmp/frontend_project_dir.txt

          echo "Frontend directory: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Check Node.js and npm
        script: |
          set -e
          node --version
          npm --version

      - name: Install npm dependencies
        script: |
          set -e

          PROJECT_DIR=$(cat /tmp/frontend_project_dir.txt)
          cd "$PROJECT_DIR"

          if [ ! -f package-lock.json ]; then
            echo "ERROR: package-lock.json not found."
            exit 1
          fi

          npm ci --no-audit --no-fund

      - name: Build web application
        script: |
          set -e

          PROJECT_DIR=$(cat /tmp/frontend_project_dir.txt)
          cd "$PROJECT_DIR"

          npm run build:mobile

      - name: Prepare Capacitor iOS project
        script: |
          set -e

          PROJECT_DIR=$(cat /tmp/frontend_project_dir.txt)
          cd "$PROJECT_DIR"

          if [ ! -d ios ]; then
            echo "iOS platform directory missing. Adding Capacitor iOS..."
            npx cap add ios
          fi

          npx cap sync ios

          if [ ! -f ios/App/Podfile ]; then
            echo "ERROR: ios/App/Podfile was not generated."
            echo "Checking available Podfiles..."
            find ios -name Podfile -print || true
            exit 1
          fi

      - name: Install CocoaPods dependencies
        script: |
          set -e

          PROJECT_DIR=$(cat /tmp/frontend_project_dir.txt)
          cd "$PROJECT_DIR/ios/App"

          pod install

      - name: Build iOS application
        script: |
          set -e

          PROJECT_DIR=$(cat /tmp/frontend_project_dir.txt)

          if [ ! -d "$PROJECT_DIR/ios/App/App.xcodeproj" ]; then
            echo "ERROR: App.xcodeproj not found."
            find "$PROJECT_DIR/ios" -maxdepth 4 \
              \( -name '*.xcodeproj' -o -name '*.xcworkspace' \) -print
            exit 1
          fi

          xcode-project build-ipa \
            --project "$PROJECT_DIR/ios/App/App.xcodeproj" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - "**/build/ios/ipa/*.ipa"
      - "**/ios/App/build/**/*.ipa"
      - /tmp/xcodebuild_logs/*.log
