
workflows:
  capacitor-ios:
    name: Capacitor iOS Build
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      # Optionally specify your Node.js version if needed
      # Use the version supported by your project.

    scripts:
      - name: Check Node.js and npm
        script: |
          set -e
          echo "Node.js version:"
          node --version
          echo "npm version:"
          npm --version
          echo "Working directory:"
          pwd
          ls -la

      - name: Install npm dependencies
        script: |
          set -e
          if [ ! -f package.json ]; then
            echo "ERROR: package.json not found in $CM_BUILD_DIR"
            exit 1
          fi

          if [ ! -f package-lock.json ]; then
            echo "ERROR: package-lock.json not found. Commit your lock file or use npm install."
            exit 1
          fi

          npm ci --no-audit --no-fund

      - name: Build web application
        script: |
          set -e
          npm run build

      - name: Sync Capacitor iOS
        script: |
          set -e
          npx cap sync ios

      - name: Install CocoaPods dependencies
        script: |
          set -e
          cd ios/App
          pod install

      - name: Build iOS application
        script: |
          set -e
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
