workflows:
  capacitor-ios:
    name: TaxMate iOS TestFlight Build
    max_build_duration: 120
    instance_type: mac_mini_m2

    # Name must match the integration you created in Codemagic:
    # Team settings > Integrations > Developer Portal
    integrations:
      app_store_connect: taxmate_api

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ascratech.taxmate

      vars:
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.ascratech.taxmate"

      node: latest
      xcode: latest

    scripts:
      - name: Locate frontend project
        script: |
          set -euo pipefail

          PACKAGE_FILE=""

          while IFS= read -r file; do
            DIR="$(dirname "$file")"

            if [ -f "$DIR/capacitor.config.ts" ] ||
               [ -f "$DIR/capacitor.config.json" ] ||
               [ -f "$DIR/capacitor.config.js" ]; then
              PACKAGE_FILE="$file"
              break
            fi
          done < <(
            find "$CM_BUILD_DIR" \
              -maxdepth 6 \
              -type f \
              -name package.json \
              -not -path '*/node_modules/*' \
              -not -path '*/.git/*'
          )

          if [ -z "$PACKAGE_FILE" ]; then
            echo "ERROR: Capacitor package.json not found."
            exit 1
          fi

          PROJECT_DIR="$(cd "$(dirname "$PACKAGE_FILE")" && pwd)"
          echo "$PROJECT_DIR" > /tmp/taxmate_project_dir.txt

          echo "Project directory: $PROJECT_DIR"
          echo "Package file: $PACKAGE_FILE"

      - name: Check build environment
        script: |
          set -euo pipefail

          node --version
          npm --version
          xcodebuild -version
          xcrun --find xcodebuild

      - name: Install npm dependencies
        script: |
          set -euo pipefail

          PROJECT_DIR="$(cat /tmp/taxmate_project_dir.txt)"
          cd "$PROJECT_DIR"

          if [ ! -f package-lock.json ]; then
            echo "ERROR: package-lock.json not found."
            exit 1
          fi

          npm ci --no-audit --no-fund

      - name: Build web application
        script: |
          set -euo pipefail

          PROJECT_DIR="$(cat /tmp/taxmate_project_dir.txt)"
          cd "$PROJECT_DIR"

          npm run build:mobile

          if [ ! -d dist-mobile ]; then
            echo "ERROR: dist-mobile was not generated."
            echo "Check the output directory configured by build:mobile."
            exit 1
          fi

          echo "Web build output:"
          ls -la dist-mobile

      - name: Prepare Capacitor iOS project
        script: |
          set -euo pipefail

          PROJECT_DIR="$(cat /tmp/taxmate_project_dir.txt)"
          cd "$PROJECT_DIR"

          if [ ! -f capacitor.config.ts ] &&
             [ ! -f capacitor.config.json ] &&
             [ ! -f capacitor.config.js ]; then
            echo "ERROR: Capacitor config file not found."
            exit 1
          fi

          if [ ! -d ios/App/App.xcodeproj ]; then
            echo "iOS project missing or incomplete."

            if [ ! -d ios ]; then
              npx cap add ios
            else
              echo "ERROR: ios directory exists but ios/App/App.xcodeproj is missing."
              echo "Restore the iOS project or regenerate it intentionally."
              exit 1
            fi
          fi

          npx cap sync ios

          test -d ios/App/App.xcodeproj

          echo "Available Xcode schemes:"
          xcodebuild \
            -list \
            -project "$PROJECT_DIR/ios/App/App.xcodeproj"

      - name: Set build number and export compliance
        script: |
          set -euo pipefail

          PROJECT_DIR="$(cat /tmp/taxmate_project_dir.txt)"
          PBXPROJ="$PROJECT_DIR/ios/App/App.xcodeproj/project.pbxproj"
          INFO_PLIST="$PROJECT_DIR/ios/App/App/Info.plist"

          # TestFlight needs a unique, increasing build number for every upload.
          # Codemagic's BUILD_NUMBER increases automatically with each build.
          sed -i '' "s/CURRENT_PROJECT_VERSION = [^;]*;/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/g" "$PBXPROJ"
          echo "Build number set to: $BUILD_NUMBER"
          grep "CURRENT_PROJECT_VERSION" "$PBXPROJ" | sort -u

          # Skips the export compliance question in TestFlight.
          # Only correct if the app uses standard HTTPS encryption (exempt).
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$INFO_PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$INFO_PLIST"

      - name: Configure iOS code signing
        script: |
          set -euo pipefail

          PROJECT_DIR="$(cat /tmp/taxmate_project_dir.txt)"
          cd "$PROJECT_DIR"

          xcode-project use-profiles

      - name: Resolve Swift dependencies
        script: |
          set -euo pipefail

          PROJECT_DIR="$(cat /tmp/taxmate_project_dir.txt)"

          xcodebuild \
            -resolvePackageDependencies \
            -project "$PROJECT_DIR/ios/App/App.xcodeproj" \
            -scheme "$XCODE_SCHEME"

      - name: Build App Store IPA
        script: |
          set -euo pipefail

          PROJECT_DIR="$(cat /tmp/taxmate_project_dir.txt)"
          cd "$PROJECT_DIR"

          mkdir -p "$CM_BUILD_DIR/ipa-output"

          xcode-project build-ipa \
            --project "$PROJECT_DIR/ios/App/App.xcodeproj" \
            --scheme "$XCODE_SCHEME"

          echo "Searching for generated IPA..."

          find "$PROJECT_DIR" \
            -type f \
            -name "*.ipa" \
            -not -path '*/Pods/*' \
            -not -path '*/node_modules/*' \
            -not -path '*/taxmate-artifacts/*' \
            -print

          IPA_FILE=""

          if [ -d "$PROJECT_DIR/build/ios/ipa" ]; then
            IPA_FILE="$(find "$PROJECT_DIR/build/ios/ipa" \
              -maxdepth 1 \
              -type f \
              -name "*.ipa" \
              -print -quit)"
          fi

          if [ -z "$IPA_FILE" ]; then
            IPA_FILE="$(find "$PROJECT_DIR" \
              -type f \
              -name "*.ipa" \
              -not -path '*/Pods/*' \
              -not -path '*/node_modules/*' \
              -not -path '*/taxmate-artifacts/*' \
              -print -quit)"
          fi

          if [ -z "$IPA_FILE" ]; then
            echo "ERROR: IPA was not generated."
            echo "Inspect the Xcode archive/export errors above."
            exit 1
          fi

          cp "$IPA_FILE" \
            "$CM_BUILD_DIR/ipa-output/TaxMate-testflight.ipa"

          echo "IPA copied to:"
          ls -lh "$CM_BUILD_DIR/ipa-output/TaxMate-testflight.ipa"

      - name: Verify IPA artifact
        script: |
          set -euo pipefail

          IPA_FILE="$CM_BUILD_DIR/ipa-output/TaxMate-testflight.ipa"

          if [ ! -s "$IPA_FILE" ]; then
            echo "ERROR: Expected IPA artifact is missing or empty."
            exit 1
          fi

          echo "IPA artifact verified."
          file "$IPA_FILE"

          echo "IPA archive contents:"
          unzip -l "$IPA_FILE" | head -40 || true

      - name: Create ZIP with IPA and build logs
        script: |
          set -euo pipefail

          STAGING_DIR="$CM_BUILD_DIR/taxmate-artifacts"
          ZIP_FILE="$CM_BUILD_DIR/TaxMate-iOS-artifacts.zip"

          rm -rf "$STAGING_DIR"
          mkdir -p "$STAGING_DIR"

          # Include the generated IPA.
          cp "$CM_BUILD_DIR/ipa-output/TaxMate-testflight.ipa" \
            "$STAGING_DIR/TaxMate-testflight.ipa"

          # Include available Xcode build logs.
          if [ -d /tmp/xcodebuild_logs ]; then
            mkdir -p "$STAGING_DIR/build-logs"

            find /tmp/xcodebuild_logs \
              -maxdepth 1 \
              -type f \
              -name "*.log" \
              -exec cp {} "$STAGING_DIR/build-logs/" \;
          fi

          # Include other files in the exported IPA directory, if present.
          PROJECT_DIR="$(cat /tmp/taxmate_project_dir.txt)"

          if [ -d "$PROJECT_DIR/build/ios/ipa" ]; then
            mkdir -p "$STAGING_DIR/ipa-export"

            find "$PROJECT_DIR/build/ios/ipa" \
              -maxdepth 1 \
              -type f \
              ! -name "*.ipa" \
              -exec cp {} "$STAGING_DIR/ipa-export/" \;
          fi

          # Include available Xcode archive and debug symbols, if present.
          ARCHIVE_DIR="$PROJECT_DIR/build/ios/archive"

          if [ -d "$ARCHIVE_DIR" ]; then
            mkdir -p "$STAGING_DIR/xcode-archive"

            find "$ARCHIVE_DIR" \
              -maxdepth 1 \
              -type d \
              -name "*.xcarchive" \
              -print
          fi

          # Create a ZIP containing the collected artifacts.
          rm -f "$ZIP_FILE"

          cd "$CM_BUILD_DIR"
          /usr/bin/zip -r "$ZIP_FILE" taxmate-artifacts

          if [ ! -s "$ZIP_FILE" ]; then
            echo "ERROR: Artifact ZIP was not created."
            exit 1
          fi

          echo "ZIP created successfully:"
          ls -lh "$ZIP_FILE"

          echo "Verifying ZIP contents:"
          unzip -t "$ZIP_FILE"
          unzip -l "$ZIP_FILE"

    artifacts:
      - ipa-output/*.ipa
      - TaxMate-iOS-artifacts.zip
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        # Sends the build to TestFlight after it is processed.
        submit_to_testflight: true