
workflows:
  capacitor-ios:
    name: Capacitor iOS Build
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      vars:
        XCODE_SCHEME: "App"
        NODE_VERSION: "22"

    scripts:
      - name: Locate frontend project
        script: |
          set -e

          PACKAGE_FILE=$(find "$CM_BUILD_DIR" \
            -maxdepth 5 \
            -type f \
            -name package.json \
            -not -path '*/node_modules/*' \
            | head -n 1)

          if [ -z "$PACKAGE_FILE" ]; then
            echo "ERROR: package.json not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE_FILE")
          echo "$PROJECT_DIR" > /tmp/frontend_project_dir.txt

          echo "Frontend project: $PROJECT_DIR"

      - name: Check build tools
        script: |
          set -e
          node --version
          npm --version
          xcodebuild -version
          pod --version

      - name: Install npm dependencies
        script: |
          set -e
          PROJECT_DIR=$(cat /tmp/frontend_project_dir.txt)
          cd "$PROJECT_DIR"

          test -f package-lock.json || {
            echo "ERROR: package-lock.json is missing"
            exit 1
          }

          npm ci --no-audit --no-fund

      - name: Build web application
        script: |
          set -e
          PROJECT_DIR=$(cat /tmp/frontend_project_dir.txt)
          cd "$PROJECT_DIR"

          npm run build:mobile

      - name: Generate iOS project
        script: |
          set -e
          PROJECT_DIR=$(cat /tmp/frontend_project_dir.txt)
          cd "$PROJECT_DIR"

          if [ ! -f capacitor.config.ts ] && \
             [ ! -f capacitor.config.json ] && \
             [ ! -f capacitor.config.js ]; then
            echo "ERROR: Capacitor configuration file not found"
            exit 1
          fi

          if [ ! -d ios ]; then
            echo "Generating the iOS project..."
            npx cap add ios
          else
            echo "iOS project already exists; keeping existing native files"
          fi

          npx cap sync ios

          if [ ! -f ios/App/Podfile ]; then
            echo "ERROR: Podfile was not generated at ios/App/Podfile"
            find ios -name Podfile -print || true
            exit 1
          fi

      - name: Install CocoaPods dependencies
        script: |
          set -e
          PROJECT_DIR=$(cat /tmp/frontend_project_dir.txt)
          cd "$PROJECT_DIR/ios/App"

          pod install

      - name: Build iOS IPA
        script: |
          set -e
          PROJECT_DIR=$(cat /tmp/frontend_project_dir.txt)

          xcode-project build-ipa \
            --project "$PROJECT_DIR/ios/App/App.xcodeproj" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - "**/*.ipa"
      - /tmp/xcodebuild_logs/*.log
