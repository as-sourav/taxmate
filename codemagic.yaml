
workflows:
  capacitor-ios:
    name: TaxMate iOS Build
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      ios_signing:
        distribution_type: development
        bundle_identifier: com.yourcompany.taxmate

      vars:
        XCODE_SCHEME: "App"

    scripts:
      - name: Locate frontend project
        script: |
          set -e

          PACKAGE_FILE=$(find "$CM_BUILD_DIR" \
            -maxdepth 5 \
            -type f \
            -name package.json \
            -not -path '*/node_modules/*' \
            | head -n 1)

          if [ -z "$PACKAGE_FILE" ]; then
            echo "ERROR: package.json not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE_FILE")
          echo "$PROJECT_DIR" > /tmp/frontend_project_dir.txt

          echo "Frontend project: $PROJECT_DIR"

      - name: Check build tools
        script: |
          set -e
          node --version
          npm --version
          xcodebuild -version

      - name: Install npm dependencies
        script: |
          set -e

          PROJECT_DIR=$(cat /tmp/frontend_project_dir.txt)
          cd "$PROJECT_DIR"

          if [ ! -f package-lock.json ]; then
            echo "ERROR: package-lock.json not found"
            exit 1
          fi

          npm ci --no-audit --no-fund

      - name: Build web application
        script: |
          set -e

          PROJECT_DIR=$(cat /tmp/frontend_project_dir.txt)
          cd "$PROJECT_DIR"

          npm run build:mobile

          if [ ! -d dist-mobile ]; then
            echo "ERROR: dist-mobile directory was not generated"
            exit 1
          fi

      - name: Prepare iOS project
        script: |
          set -e

          PROJECT_DIR=$(cat /tmp/frontend_project_dir.txt)
          cd "$PROJECT_DIR"

          if [ ! -f capacitor.config.ts ] && \
             [ ! -f capacitor.config.json ] && \
             [ ! -f capacitor.config.js ]; then
            echo "ERROR: Capacitor configuration file not found"
            exit 1
          fi

          if [ ! -d ios ]; then
            echo "Creating iOS project with Swift Package Manager"
            npx cap add ios --packagemanager SPM
          fi

          npx cap sync ios

          if [ ! -d ios/App/App.xcodeproj ]; then
            echo "ERROR: ios/App/App.xcodeproj not found"
            exit 1
          fi

      - name: Configure iOS code signing
        script: |
          set -e

          PROJECT_DIR=$(cat /tmp/frontend_project_dir.txt)
          cd "$PROJECT_DIR"

          xcode-project use-profiles

      - name: Resolve Swift dependencies
        script: |
          set -e

          PROJECT_DIR=$(cat /tmp/frontend_project_dir.txt)

          xcodebuild \
            -resolvePackageDependencies \
            -project "$PROJECT_DIR/ios/App/App.xcodeproj" \
            -scheme "$XCODE_SCHEME"

      - name: Build iOS IPA
        script: |
          set -e

          PROJECT_DIR=$(cat /tmp/frontend_project_dir.txt)

          xcode-project build-ipa \
            --project "$PROJECT_DIR/ios/App/App.xcodeproj" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - "**/*.ipa"
      - /tmp/xcodebuild_logs/*.log
