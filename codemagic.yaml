workflows:
  capacitor-ios:
    name: TaxMate iOS Development Build
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: taxmate-app-store-connect

    environment:
      ios_signing:
        distribution_type: development
        bundle_identifier: com.ascratech.taxmate

      vars:
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.ascratech.taxmate"
        PROVISIONING_PROFILE_NAME: "taxmate"

      node: latest
      xcode: latest

    scripts:
      - name: Locate frontend project
        script: |
          set -euo pipefail

          PACKAGE_FILE=""

          while IFS= read -r file; do
            DIR="$(dirname "$file")"

            if [ -f "$DIR/capacitor.config.ts" ] ||
               [ -f "$DIR/capacitor.config.json" ] ||
               [ -f "$DIR/capacitor.config.js" ]; then
              PACKAGE_FILE="$file"
              break
            fi
          done < <(
            find "$CM_BUILD_DIR" \
              -maxdepth 6 \
              -type f \
              -name package.json \
              -not -path '*/node_modules/*' \
              -not -path '*/.git/*'
          )

          if [ -z "$PACKAGE_FILE" ]; then
            echo "ERROR: Capacitor package.json not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PACKAGE_FILE")"
          echo "$PROJECT_DIR" > /tmp/taxmate_project_dir.txt
          echo "Project directory: $PROJECT_DIR"

      - name: Check build environment
        script: |
          set -euo pipefail
          node --version
          npm --version
          xcodebuild -version

      - name: Install npm dependencies
        script: |
          set -euo pipefail

          PROJECT_DIR="$(cat /tmp/taxmate_project_dir.txt)"
          cd "$PROJECT_DIR"

          if [ ! -f package-lock.json ]; then
            echo "ERROR: package-lock.json not found."
            exit 1
          fi

          npm ci --no-audit --no-fund

      - name: Build web application
        script: |
          set -euo pipefail

          PROJECT_DIR="$(cat /tmp/taxmate_project_dir.txt)"
          cd "$PROJECT_DIR"

          npm run build:mobile

          if [ ! -d dist-mobile ]; then
            echo "ERROR: dist-mobile was not generated."
            exit 1
          fi

      - name: Prepare Capacitor iOS project
        script: |
          set -euo pipefail

          PROJECT_DIR="$(cat /tmp/taxmate_project_dir.txt)"
          cd "$PROJECT_DIR"

          if [ ! -f capacitor.config.ts ] &&
             [ ! -f capacitor.config.json ] &&
             [ ! -f capacitor.config.js ]; then
            echo "ERROR: Capacitor config file not found."
            exit 1
          fi

          if [ ! -d ios ]; then
            npx cap add ios
          fi

          npx cap sync ios

          if [ ! -d ios/App/App.xcodeproj ]; then
            echo "ERROR: ios/App/App.xcodeproj not found."
            exit 1
          fi

      - name: Configure iOS code signing
        script: |
          set -euo pipefail

          PROJECT_DIR="$(cat /tmp/taxmate_project_dir.txt)"
          cd "$PROJECT_DIR"

          # Uses signing assets configured in Codemagic.
          xcode-project use-profiles

      - name: Resolve Swift dependencies
        script: |
          set -euo pipefail

          PROJECT_DIR="$(cat /tmp/taxmate_project_dir.txt)"

          xcodebuild \
            -resolvePackageDependencies \
            -project "$PROJECT_DIR/ios/App/App.xcodeproj" \
            -scheme "$XCODE_SCHEME"

      - name: Build development IPA
        script: |
          set -euo pipefail

          PROJECT_DIR="$(cat /tmp/taxmate_project_dir.txt)"

          xcode-project build-ipa \
            --project "$PROJECT_DIR/ios/App/App.xcodeproj" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
